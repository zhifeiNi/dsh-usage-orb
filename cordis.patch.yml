# dsh-usage-panel bundle patch
#
# 这是一个「组合包（bundle）」的配置层。当它被 profile 的 bundles 列表引用，
# 或以 --patch overlay 的方式叠加时，下面这条 insert 会把插件挂载进 Loader。
#
# 本地试用（不修改任何现有 profile）：
#   dsh --profile desktop --patch "D:\Agent\dsh-usage-panel\cordis.patch.yml"
#
# 说明：插件模块路径使用绝对路径，因此不依赖 profile 的 node_modules 解析。
- insert:
    - id: usage-panel
      name: 'D:/Agent/dsh-usage-panel/lib/index.js'
